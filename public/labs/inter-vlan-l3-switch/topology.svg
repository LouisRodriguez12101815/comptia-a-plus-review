<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" role="img" aria-labelledby="t d">
<title id="t">Lab 04 topology</title>
<desc id="d">A Layer 3 switch MLS1 with SVIs for VLAN 10 and VLAN 20 connects down to access switch SW2 over an 802.1Q trunk and up to edge router R1 over a routed port. PC1 and PC2 are in VLAN 10, PC3 and SRV1 in VLAN 20.</desc>
<rect width="960" height="432" fill="#0b1220"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#e2e8f0">
<g stroke="#22d3ee" stroke-width="3" fill="none">
 <line x1="480" y1="92" x2="480" y2="168"/>
 <line x1="480" y1="232" x2="250" y2="300"/>
</g>
<g stroke="#64748b" stroke-width="2"><line x1="250" y1="340" x2="150" y2="380"/><line x1="250" y1="340" x2="350" y2="380"/><line x1="550" y1="232" x2="620" y2="380"/><line x1="585" y1="232" x2="800" y2="380"/></g>
<g font-size="13" fill="#94a3b8">
 <text x="492" y="135">Gi1/0/24 routed · 10.1.99.2/30</text>
 <text x="40" y="272">Gi1/0/1 ↔ Gi0/1 · 802.1Q trunk (VLAN 10)</text>
 <text x="690" y="300">Gi1/0/2-3 · access VLAN 20</text>
</g>
<rect x="400" y="40" width="160" height="52" rx="10" fill="#111c33" stroke="#22d3ee"/><text x="480" y="64" text-anchor="middle" font-weight="700">R1 · edge router</text><text x="480" y="82" text-anchor="middle" font-size="12" fill="#94a3b8">G0/0 10.1.99.1/30 · NAT to ISP</text>
<rect x="370" y="168" width="220" height="64" rx="10" fill="#0f2a33" stroke="#2dd4bf" stroke-width="2"/><text x="480" y="192" text-anchor="middle" font-weight="700">MLS1 · Layer 3 switch</text><text x="480" y="210" text-anchor="middle" font-size="12" fill="#94a3b8">ip routing · Vlan10 10.1.10.1</text><text x="480" y="225" text-anchor="middle" font-size="12" fill="#94a3b8">Vlan20 10.1.20.1</text>
<rect x="180" y="300" width="140" height="40" rx="10" fill="#111c33" stroke="#64748b"/><text x="250" y="325" text-anchor="middle" font-weight="700">SW2 · L2 access</text>
<g font-size="12">
 <rect x="90" y="380" width="120" height="34" rx="8" fill="#1e293b"/><text x="150" y="395" text-anchor="middle">PC1 · VLAN 10</text><text x="150" y="409" text-anchor="middle" fill="#94a3b8">10.1.10.20</text>
 <rect x="290" y="380" width="120" height="34" rx="8" fill="#1e293b"/><text x="350" y="395" text-anchor="middle">PC2 · VLAN 10</text><text x="350" y="409" text-anchor="middle" fill="#94a3b8">10.1.10.21</text>
 <rect x="560" y="380" width="120" height="34" rx="8" fill="#1e293b"/><text x="620" y="395" text-anchor="middle">PC3 · VLAN 20</text><text x="620" y="409" text-anchor="middle" fill="#94a3b8">10.1.20.30</text>
 <rect x="740" y="380" width="120" height="34" rx="8" fill="#1e293b"/><text x="800" y="395" text-anchor="middle">SRV1 · VLAN 20</text><text x="800" y="409" text-anchor="middle" fill="#94a3b8">10.1.20.100</text>
</g></g></svg>
