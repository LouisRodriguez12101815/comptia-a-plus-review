<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-label="Logical diagram of Router-MIA, Router-NY, and Router-DC with DHCP servers behind Router-DC">
  <rect width="960" height="460" fill="#ffffff"/>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
    .t{font-size:15px;font-weight:700}
    .s{font-size:12px;fill:#334155}
    .l{font-size:12px;fill:#0f766e;font-weight:700}
    .r{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}
    .w{fill:#f1f5f9;stroke:#475569;stroke-width:2}
    .p{fill:#ffffff;stroke:#475569;stroke-width:2}
    .v{fill:#ecfdf5;stroke:#047857;stroke-width:2}
    .k{stroke:#334155;stroke-width:2.5;fill:none}
    .d{stroke:#047857;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
  </style>
  <!-- WAN links -->
  <line class="k" x1="250" y1="100" x2="710" y2="100"/>
  <line class="k" x1="235" y1="130" x2="415" y2="245"/>
  <line class="k" x1="725" y1="130" x2="545" y2="245"/>
  <text class="l" x="480" y="90" text-anchor="middle">10.0.1.0/30</text>
  <text class="l" x="290" y="195" text-anchor="middle">10.0.2.0/30</text>
  <text class="l" x="670" y="195" text-anchor="middle">10.0.3.0/30</text>
  <!-- Miami -->
  <text class="l" x="165" y="58" text-anchor="middle">ip helper-address 192.168.50.10</text>
  <rect class="r" x="80" y="70" width="170" height="60" rx="10"/>
  <text class="t" x="165" y="96" text-anchor="middle">Router-MIA</text>
  <text class="s" x="165" y="116" text-anchor="middle">LAN gw 192.168.0.1</text>
  <line class="k" x1="165" y1="130" x2="165" y2="215"/>
  <rect class="w" x="115" y="215" width="100" height="40" rx="8"/>
  <text class="t" x="165" y="240" text-anchor="middle">SW-MIA</text>
  <line class="k" x1="145" y1="255" x2="95" y2="305"/><line class="k" x1="185" y1="255" x2="235" y2="305"/>
  <rect class="p" x="55" y="305" width="80" height="36" rx="6"/><text class="s" x="95" y="328" text-anchor="middle">Miami PC</text>
  <rect class="p" x="195" y="305" width="80" height="36" rx="6"/><text class="s" x="235" y="328" text-anchor="middle">Miami PC</text>
  <text class="s" x="165" y="365" text-anchor="middle">192.168.0.0/26</text>
  <!-- New York -->
  <text class="l" x="795" y="58" text-anchor="middle">ip helper-address 192.168.50.20</text>
  <rect class="r" x="710" y="70" width="170" height="60" rx="10"/>
  <text class="t" x="795" y="96" text-anchor="middle">Router-NY</text>
  <text class="s" x="795" y="116" text-anchor="middle">LAN gw 192.168.0.65</text>
  <line class="k" x1="795" y1="130" x2="795" y2="215"/>
  <rect class="w" x="745" y="215" width="100" height="40" rx="8"/>
  <text class="t" x="795" y="240" text-anchor="middle">SW-NY</text>
  <line class="k" x1="775" y1="255" x2="725" y2="305"/><line class="k" x1="815" y1="255" x2="865" y2="305"/>
  <rect class="p" x="685" y="305" width="80" height="36" rx="6"/><text class="s" x="725" y="328" text-anchor="middle">NY PC</text>
  <rect class="p" x="825" y="305" width="80" height="36" rx="6"/><text class="s" x="865" y="328" text-anchor="middle">NY PC</text>
  <text class="s" x="795" y="365" text-anchor="middle">192.168.0.64/26</text>
  <!-- Data center -->
  <rect class="r" x="395" y="245" width="170" height="60" rx="10"/>
  <text class="t" x="480" y="271" text-anchor="middle">Router-DC</text>
  <text class="s" x="480" y="291" text-anchor="middle">192.168.50.1/24</text>
  <line class="k" x1="480" y1="305" x2="480" y2="335"/>
  <rect class="w" x="430" y="335" width="100" height="36" rx="8"/>
  <text class="t" x="480" y="358" text-anchor="middle">SW-DC</text>
  <line class="k" x1="455" y1="371" x2="375" y2="395"/><line class="k" x1="505" y1="371" x2="585" y2="395"/>
  <rect class="v" x="280" y="395" width="190" height="48" rx="8"/>
  <text class="t" x="375" y="417" text-anchor="middle">DHCP server (Miami)</text>
  <text class="s" x="375" y="435" text-anchor="middle">192.168.50.10</text>
  <rect class="v" x="490" y="395" width="190" height="48" rx="8"/>
  <text class="t" x="585" y="417" text-anchor="middle">DHCP server (NY)</text>
  <text class="s" x="585" y="435" text-anchor="middle">192.168.50.20</text>
</svg>
