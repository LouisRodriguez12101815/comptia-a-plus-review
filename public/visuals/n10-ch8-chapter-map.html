<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 8 map: subnetting and NAT</title>
<style>
:root{--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;--warm:#7a5418;--warm-soft:#f5ead8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;--warm:#7a5418;--warm-soft:#f5ead8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
.wrap{max-width:920px;margin:0 auto;padding-block:24px 40px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.lab{margin:12px 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lab:first-child{margin-top:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
button,select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
select{border-radius:8px;padding:4px 8px;font-weight:500}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;min-height:48px}
.out strong{color:var(--ink)}
.grid{display:grid;gap:10px}
.cell{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-width:0;font-size:14px}
.cell.good{border-color:var(--good);background:var(--good-soft)}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.cell.src{border-color:var(--accent);background:var(--accent-soft)}
.cell .t{font-weight:600}
.cell .s{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.answer{margin-top:14px;font-size:14px;color:var(--muted);max-width:72ch}
.answer strong{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border-radius:10px;padding:10px 12px;font-weight:500}
.tile .n{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .tt{font-weight:600;font-size:14px;line-height:1.3}
.tile[aria-pressed="true"] .n{color:inherit;opacity:.85}
.detail h2{font:600 20px/1.25 Georgia,serif;margin:0 0 8px}
.detail ul{margin:0 0 10px;padding-left:20px}
.detail li{margin:3px 0}
.trap{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warm-soft);color:var(--ink);font-size:14px}
.trap b{color:var(--warm)}
.seevis{margin-top:10px;font-size:13px;color:var(--muted)}
.seevis b{color:var(--accent)}
.navrow{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Chapter 8 map: subnetting and NAT</h1><p class="lede">Eight topics from the notes in the order you meet them. Pick one to see its key facts and the exam trap, then use Next to walk the chapter.</p><div class="card"><div class="lab">Pick a topic from the notes</div><div class="tiles" id="tiles"></div><div class="out detail" id="detail" aria-live="polite"></div><div class="navrow"><button id="prev">&larr; Previous topic</button><button id="next">Next topic &rarr;</button></div></div>
</div>
<script>
const ITEMS=[{"name": "Why you subnet", "tag": "1 \u00b7 Purpose", "facts": ["Add a router and you have an internetwork; hosts now need a logical addressing scheme.", "Subnetting splits one network into smaller ones, one per segment.", "IPv4 is still the most popular, so it is the focus."], "trap": null, "visual": "Quiz questions on this chapter"}, {"name": "Default masks and CIDR", "tag": "2 \u00b7 Masks", "facts": ["Class A 255.0.0.0 (/8), Class B 255.255.0.0 (/16), Class C 255.255.255.0 (/24).", "CIDR notation counts the mask bits that are on.", "Network ID is what the mask covers; host ID is the rest."], "trap": "Class B is 255.255.0.0, not 255.255.255.0.", "visual": "Subnet calculator"}, {"name": "The big five", "tag": "3 \u00b7 Method", "facts": ["Subnets: 2 to the subnet bits.", "Hosts per subnet: 2 to the host bits, minus 2.", "Valid subnets: count in the block size (256 minus the mask value).", "Broadcast: the number right before the next subnet.", "Valid hosts: everything between subnet and broadcast."], "trap": "Hosts are 2^h - 2. Forgetting the minus 2 gives 128 instead of 126.", "visual": "Subnet calculator"}, {"name": "Worked example: /25", "tag": "4 \u00b7 Example", "facts": ["192.168.10.0 with 255.255.255.128: 1 subnet bit, 7 host bits.", "2 subnets (0 and 128) with 126 hosts each.", "Broadcasts are 127 and 255."], "trap": null, "visual": "Subnet calculator"}, {"name": "Class C masks at a glance", "tag": "5 \u00b7 Table", "facts": ["/25 block 128, /26 block 64, /27 block 32, /28 block 16, /29 block 8, /30 block 4.", "Subnets times block size equals 256.", "Hosts per subnet: 126, 62, 30, 14, 6, 2."], "trap": null, "visual": "Subnet calculator"}, {"name": "Classful, classless, VLSM", "tag": "6 \u00b7 Masks in use", "facts": ["Classful: the same mask on every host and router interface.", "Classless routing allows different size masks (VLSM).", "CIDR is the slash notation for those masks."], "trap": null, "visual": "Why a /30 for WAN links"}, {"name": "/30 for WAN links", "tag": "7 \u00b7 Real world", "facts": ["A WAN link needs 2 addresses.", "A /24 wastes 252 per link; a /30 has exactly 2 hosts.", "255.255.255.252 is the mask for point-to-point links."], "trap": "Do not use a /24 on a two-address WAN link.", "visual": "Why a /30 for WAN links"}, {"name": "NAT and PAT", "tag": "8 \u00b7 NAT", "facts": ["Static NAT: fixed one-to-one.", "Dynamic NAT: public addresses from a pool.", "NAT overloading is PAT: many hosts share one public address, separated by port."], "trap": "NAT overloading and PAT are the same thing.", "visual": "Static NAT, dynamic NAT, and PAT"}];
const tiles=document.getElementById('tiles'),detail=document.getElementById('detail');
let cur=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';
 b.innerHTML='<span class="n">'+esc(it.tag||('Topic '+(i+1)))+'</span><span class="tt">'+esc(it.name)+'</span>';
 b.onclick=()=>show(i);tiles.appendChild(b)});
function show(i){cur=i;const it=ITEMS[i];
 [...tiles.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'));
 let h='<h2>'+esc(it.name)+'</h2><ul>'+it.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>';
 if(it.trap)h+='<div class="trap"><b>Exam trap:</b> '+esc(it.trap)+'</div>';
 if(it.visual)h+='<div class="seevis">Interactive visual for this topic: <b>'+esc(it.visual)+'</b></div>';
 detail.innerHTML=h;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===ITEMS.length-1}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
show(0);

</script>
</body>
</html>
