<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAID 5 and video cards</title>
<style>
:root{--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;--warm:#7a5418;--warm-soft:#f5ead8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
.wrap{max-width:920px;margin:0 auto;padding-block:24px 40px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.lab{margin:12px 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lab:first-child{margin-top:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
button,select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
select{border-radius:8px;padding:4px 8px;font-weight:500}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;min-height:48px}
.out strong{color:var(--ink)}
.grid{display:grid;gap:10px}
.cell{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-width:0;font-size:14px}
.cell.good{border-color:var(--good);background:var(--good-soft)}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.cell.src{border-color:var(--accent);background:var(--accent-soft)}
.cell .t{font-weight:600}
.cell .s{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.answer{margin-top:14px;font-size:14px;color:var(--muted);max-width:72ch}
.answer strong{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

button{min-height:44px}
.opts{flex-direction:column;align-items:stretch}
.opts button,.pick button{text-align:left;border-radius:10px}
button.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
button.dim{opacity:.45}
.okbox{background:var(--good-soft)}
.nobox{background:var(--bad-soft)}
.qt{font-weight:600;margin:4px 0 10px}
.sec{margin-top:18px}
.sec h2{font:600 18px/1.3 Georgia,serif;margin:0 0 4px}
.sec .why{color:var(--muted);font-size:14px;margin:0 0 10px;max-width:70ch}
.stage{overflow-x:auto}
svg{display:block;width:100%;height:auto}
.bx{fill:var(--surface);stroke:var(--line);stroke-width:2}
.bx.on{fill:var(--accent-soft);stroke:var(--accent)}
.bx.good{fill:var(--good-soft);stroke:var(--good)}
.bx.bad{fill:var(--bad-soft);stroke:var(--bad);stroke-dasharray:6 4}
.tx{fill:var(--ink);font:600 13px system-ui,sans-serif}
.tx2{fill:var(--muted);font:13px system-ui,sans-serif}
.arr{stroke:var(--line);stroke-width:3;fill:none}
.arr.on{stroke:var(--accent)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bars{display:grid;gap:6px}
.brow{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;font-size:13px}
.brow .tr{height:16px;background:var(--line);border-radius:999px;overflow:hidden}
.brow .tr i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.brow .tm{text-align:right;font-weight:600}
@media (max-width:480px){.brow{grid-template-columns:84px 1fr 74px}}
</style>
</head>
<body>
<div class="wrap">

<h1>RAID 5 and video cards</h1>
<p class="lede">Fail drives in a RAID 5 array to see exactly when data survives, then pick the right slot for a video card.</p>
<div class="card">
 <div class="lab">1. RAID 5 array</div>
 <div class="ctrls" id="cnt" role="group" aria-label="Number of drives"></div>
 <div class="stage" tabindex="0" role="region" aria-label="Diagram. Scroll sideways with arrow keys if it is wider than the screen."><svg id="sv" viewBox="0 0 640 220" role="img" aria-label="RAID 5 drives with data and parity blocks. Tap a drive to fail it."></svg></div>
 <div class="ctrls"><button type="button" id="rb">Replace failed drive and rebuild</button><button type="button" id="rs">Reset array</button></div>
 <div class="out" id="out" aria-live="polite"></div>
</div>
<div class="card sec"><div class="lab">2. Which slot for a discrete video card?</div>
 <div class="ctrls" id="slots" role="group" aria-label="Slot types"></div>
 <div class="out" id="so" aria-live="polite">Tap a slot.</div>
 <div class="ctrls"><button type="button" id="gp" aria-pressed="false">Discrete PCIe x16 card installed</button></div>
 <div class="out" id="go" aria-live="polite"></div>
</div>
<div class="card sec"><div class="lab">Test yourself</div><div id="qz"></div></div>

</div>
<script>

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=(i*7+3)%(i+1);var t=b[i];b[i]=b[j];b[j]=t}return b}
function quiz(id,qs){var root=$(id),i=0,score=0,done=false;
 function draw(){var q=qs[i];done=false;
  root.innerHTML='<div class="lab">Question '+(i+1)+' of '+qs.length+' &middot; score '+score+'</div><p class="qt">'+esc(q.q)+'</p><div class="ctrls opts"></div><div class="out qfb" aria-live="polite" hidden></div><div class="ctrls"><button type="button" class="nx" hidden>'+(i<qs.length-1?'Next question':'Start over')+'</button></div>';
  var o=root.querySelector('.opts');
  q.o.forEach(function(t,k){var b=document.createElement('button');b.type='button';b.textContent=t;
   b.onclick=function(){if(done)return;done=true;var ok=(k===q.a);if(ok)score++;
    b.classList.add(ok?'right':'wrong');if(!ok)o.children[q.a].classList.add('right');
    var f=root.querySelector('.qfb');f.hidden=false;f.className='out qfb '+(ok?'okbox':'nobox');
    f.innerHTML='<strong>'+(ok?'Correct. ':'Not quite. ')+'Answer: '+esc(q.o[q.a])+'.</strong> '+esc(q.why);
    var n=root.querySelector('.nx');n.hidden=false;
    n.onclick=function(){if(i<qs.length-1){i++}else{i=0;score=0}draw()}};
   o.appendChild(b)})}
 draw()}
function multi(id,q,opts,answers,why){var root=$(id),sel={};
 root.innerHTML='<p class="qt">'+esc(q)+'</p><div class="ctrls opts"></div><div class="ctrls"><button type="button" class="chk">Check my answer</button></div><div class="out" aria-live="polite" hidden></div>';
 var o=root.querySelector('.opts'),out=root.querySelector('.out');
 opts.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;b.setAttribute('aria-pressed','false');
  b.onclick=function(){sel[t]=!sel[t];b.setAttribute('aria-pressed',sel[t]?'true':'false')};o.appendChild(b)});
 root.querySelector('.chk').onclick=function(){var ok=true;
  opts.forEach(function(t,k){var want=answers.indexOf(t)>=0;if(!!sel[t]!==want)ok=false;var b=o.children[k];b.classList.remove('right','wrong');if(want)b.classList.add('right');else if(sel[t])b.classList.add('wrong')});
  out.hidden=false;out.className='out '+(ok?'okbox':'nobox');
  out.innerHTML='<strong>'+(ok?'Correct. ':'Not quite. ')+'Answer: '+esc(answers.join(' + '))+'.</strong> '+esc(why)}}
function rank(id,items,order,ask){var root=$(id),placed=[],miss=0;
 function draw(){var left=shuffle(items.map(function(x){return x.k})).filter(function(k){return placed.indexOf(k)<0});
  var lab={};items.forEach(function(x){lab[x.k]=x});
  root.innerHTML='<p class="qt">'+esc(ask)+'</p><div class="lab">Tap the next one</div><div class="ctrls pick"></div><div class="lab">Your ranking</div><ol class="plc" style="margin:0 0 6px;padding-left:22px"></ol><div class="out" aria-live="polite">'+(placed.length?'':'Tap items in order. You get instant feedback each time.')+'</div><div class="ctrls"><button type="button" class="rs">Reset</button></div>';
  var p=root.querySelector('.pick'),ol=root.querySelector('.plc'),out=root.querySelector('.out');
  placed.forEach(function(k){var li=document.createElement('li');li.innerHTML='<strong>'+esc(lab[k].label)+'</strong> <span class="pill good">'+esc(lab[k].sub)+'</span>';ol.appendChild(li)});
  left.forEach(function(k){var b=document.createElement('button');b.type='button';b.textContent=lab[k].label;
   b.onclick=function(){var want=order[placed.length];
    if(k===want){placed.push(k);var msg=placed.length===order.length?'Done with '+miss+' mistake'+(miss===1?'':'s')+'. ':'Correct. ';draw();var o2=root.querySelector('.out');o2.className='out okbox';o2.innerHTML='<strong>'+msg+esc(lab[k].label)+'.</strong> '+esc(lab[k].why)}
    else{miss++;b.classList.add('wrong');out.className='out nobox';out.innerHTML='<strong>Not quite. The correct pick here is '+esc(lab[want].label)+'.</strong> '+esc(lab[want].why)}};
   p.appendChild(b)});
  root.querySelector('.rs').onclick=function(){placed=[];miss=0;draw()}}
 draw()}

var n=3,fail={};
function nf(){var c=0;for(var k in fail)if(fail[k])c++;return c}
function draw(){
 Array.prototype.forEach.call($('cnt').children,function(b){b.setAttribute('aria-pressed',b.dataset.n==n?'true':'false')});
 var w=Math.min(110,600/n-10),gap=(640-n*w)/(n+1),h='';
 for(var d=0;d<n;d++){var x=gap+d*(w+gap),f=fail[d];
  h+='<g class="drv" data-d="'+d+'" tabindex="0" role="button" aria-label="Drive '+(d+1)+(f?' failed':' healthy')+'. Tap to toggle failure." style="cursor:pointer"><rect class="bx '+(f?'bad':'good')+'" x="'+x+'" y="8" width="'+w+'" height="204" rx="10"/><text class="tx" x="'+(x+w/2)+'" y="30" text-anchor="middle">Drive '+(d+1)+(f?' (failed)':'')+'</text>';
  for(var s=0;s<3;s++){var par=(n-1-s%n+n)%n;var isP=(par===d);var di=0;
   var lbl=isP?'P'+String.fromCharCode(65+s):String.fromCharCode(65+s)+(d<par?d+1:d);
   h+='<rect x="'+(x+8)+'" y="'+(46+s*54)+'" width="'+(w-16)+'" height="44" rx="8" style="fill:'+(f?'var(--bad-soft)':(isP?'var(--warm-soft)':'var(--accent-soft)'))+';stroke:'+(isP?'var(--warm)':'var(--accent)')+'"/><text class="tx" x="'+(x+w/2)+'" y="'+(73+s*54)+'" text-anchor="middle">'+(f?'X':lbl)+'</text>'}
  h+='</g>'}
 $('sv').innerHTML=h;
 Array.prototype.forEach.call($('sv').querySelectorAll('.drv'),function(g){var go=function(){var d=g.getAttribute('data-d');fail[d]=!fail[d];draw()};g.onclick=go;g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 var c=nf(),o=$('out'),usable=(n-1)+' of '+n+' drives of capacity';
 if(c===0){o.className='out';o.innerHTML='<strong>Healthy.</strong> '+n+' drives, striping with parity (blue = data, tan = parity). Usable space is '+usable+'. Tap a drive to fail it.'}
 else if(c===1){o.className='out okbox';o.innerHTML='<strong>Degraded but alive.</strong> RAID 5 survives one drive failure: the missing blocks are recomputed from the other drives and parity. Replace the drive and rebuild, which can take hours up to months in enterprise arrays.'}
 else{o.className='out nobox';o.innerHTML='<strong>Array lost.</strong> '+c+' drives failed. RAID 5 survives only one drive failure, so restore from backup.'}
 $('rb').disabled=(c===0||c>1)}
[3,4,5].forEach(function(k){var b=document.createElement('button');b.type='button';b.dataset.n=k;b.textContent=k+' drives';b.onclick=function(){n=k;fail={};draw()};$('cnt').appendChild(b)});
var b2=document.createElement('button');b2.type='button';b2.textContent='2 drives';b2.onclick=function(){$('out').className='out nobox';$('out').innerHTML='<strong>Not allowed. RAID 5 needs a minimum of 3 drives.</strong> Striping with parity needs at least three.'};$('cnt').appendChild(b2);
$('rb').onclick=function(){fail={};draw();$('out').className='out okbox';$('out').innerHTML='<strong>Rebuilt.</strong> Parity restored the data onto the new drive. In real enterprise arrays this rebuild is a real operational challenge, taking hours to months.'};
$('rs').onclick=function(){fail={};draw()};draw();
var SL=[['PCIe x16',1,'PCIe x16 is the standard discrete video slot and gives the highest bandwidth.'],['PCIe x128',0,'PCIe x128 is not a real standard.'],['AGP',0,'AGP is obsolete.'],['Plain PCI',0,'Plain PCI is too slow for video.']];
SL.forEach(function(s){var b=document.createElement('button');b.type='button';b.textContent=s[0];b.onclick=function(){Array.prototype.forEach.call($('slots').children,function(x){x.classList.remove('right','wrong')});b.classList.add(s[1]?'right':'wrong');$('so').className='out '+(s[1]?'okbox':'nobox');$('so').innerHTML='<strong>'+s[0]+': '+(s[1]?'correct slot.':'wrong choice. Correct answer: PCIe x16.')+'</strong> '+s[2]};$('slots').appendChild(b)});
var gp=false;$('gp').onclick=function(){gp=!gp;this.setAttribute('aria-pressed',gp?'true':'false');$('go').className='out '+(gp?'okbox':'');$('go').innerHTML=gp?'<strong>Discrete and integrated can coexist.</strong> You may disable the integrated graphics (IGP) in BIOS. PCIe cards are usually auto-detected, but still install the correct driver.':''};
quiz('qz',[
 {q:'What is the minimum number of drives for RAID 5?',o:['2','3','5'],a:1,why:'RAID 5 needs a minimum of 3 drives for striping with parity.'},
 {q:'A RAID 5 array loses two drives at once. What happens?',o:['It keeps running on parity','The data is lost; it survives only one failure','It rebuilds automatically in seconds'],a:1,why:'RAID 5 survives one drive failure, not two.'},
 {q:'Which is the standard slot for a discrete video card?',o:['PCIe x16','PCIe x128','AGP'],a:0,why:'PCIe x16 is the standard. x128 is not real, AGP is obsolete.'},
 {q:'After installing a PCIe video card that was auto-detected, what should you still do?',o:['Nothing, drivers are never needed','Install the correct driver','Replace the PSU with DC output'],a:1,why:'PCIe cards are usually auto-detected, but you still install the correct driver.'}
]);

</script>
</body>
</html>
