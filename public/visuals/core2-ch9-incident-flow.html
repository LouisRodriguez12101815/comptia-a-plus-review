<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Incident evidence flow</title><style>
:root{--bg:#eef3fa;--surface:#fff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;color-scheme:light}@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;color-scheme:dark}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui;padding:0 16px}.wrap{max-width:900px;margin:auto;padding:24px 0 40px}h1{font-size:26px;margin:0 0 6px}.lede,figcaption{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.diagram{overflow-x:auto}svg{width:100%;height:auto;min-width:640px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{font:inherit;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:8px 13px}button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.out{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);min-height:48px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><h1>Incident evidence flow</h1><p class="lede">Preserve first, report through policy, and document handling.</p><section class="card"><figure><div class="diagram" tabindex="0" role="region" aria-label="Incident evidence flow diagram"><svg viewBox="0 0 760 300" role="img" aria-label="Incident evidence flow from discovery to preservation to reporting and documentation">
<rect x="35" y="105" width="140" height="80" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="105" y="139" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">Discover</text><text x="105" y="163" text-anchor="middle" fill="var(--muted)" font-size="12">Potential incident</text>
<path d="M175 145H265" stroke="var(--line)" stroke-width="4"/>
<rect x="265" y="105" width="140" height="80" rx="12" fill="var(--surface)" stroke="var(--good)" stroke-width="2"/><text x="335" y="139" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">Preserve</text><text x="335" y="163" text-anchor="middle" fill="var(--muted)" font-size="12">Do not alter</text>
<path d="M405 145H495" stroke="var(--line)" stroke-width="4"/>
<rect x="495" y="105" width="105" height="80" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="548" y="139" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">Report</text><text x="548" y="163" text-anchor="middle" fill="var(--muted)" font-size="12">Proper channel</text>
<path d="M600 145H660" stroke="var(--line)" stroke-width="4"/>
<rect x="660" y="105" width="70" height="80" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="695" y="139" text-anchor="middle" fill="var(--ink)" font-size="14" font-weight="700">Log</text><text x="695" y="163" text-anchor="middle" fill="var(--muted)" font-size="11">Custody</text>
</svg></div><figcaption>A simple incident response path for evidence preservation and escalation.</figcaption></figure><div class="controls"><button data-k="delete">Delete prohibited material?</button><button data-k="aup">Personal business on work PC?</button><button data-k="pii">Government ID?</button></div><div class="out" id="out" aria-live="polite">Choose an option to check your understanding.</div></section></main><script type="application/json" id="visual-facts">{
  "facts": [
    {
      "claim": "Preserve evidence and report prohibited content or serious incidents through approved channels.",
      "objectives": [
        "220-1202 4.6"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Incident response and evidence"
      ]
    },
    {
      "claim": "Chain of custody records who handled evidence and when.",
      "objectives": [
        "220-1202 4.6"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Incident response and evidence"
      ]
    },
    {
      "claim": "An acceptable use policy defines permitted and prohibited use of organizational resources.",
      "objectives": [
        "220-1202 4.6"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Agreements, acceptable use, and compliance"
      ]
    }
  ],
  "simplifications": [
    "The drawings are schematic learning diagrams."
  ]
}</script><script>document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-k]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const m={delete:'No. Preserve the evidence and report it through the approved channels.',aup:'Check the AUP; if policy prohibits the use, use an authorized personal system instead.',pii:'A government-issued identifier tied to a person is PII.'};document.getElementById('out').textContent=m[b.dataset.k];});</script></body></html>
