<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disaster recovery pattern ladder</title><style>body{margin:0;background:#0b1220;color:#f1f5f9;font:15px/1.5 system-ui;padding:20px}.wrap{max-width:960px;margin:auto}.card{border:1px solid #334155;border-radius:16px;background:#111c30;padding:18px}svg{width:100%;height:auto}.n{fill:#16263f;stroke:#38bdf8;stroke-width:2}.g{stroke:#34d399}.o{stroke:#fb923c}.t{fill:#f1f5f9;font-size:15px;font-weight:700}.s{fill:#b8c5d6;font-size:12px}figcaption{color:#b8c5d6;margin-top:10px}</style></head><body><main class="wrap"><h1>Disaster recovery pattern ladder</h1><section class="card"><figure><svg viewBox="0 0 920 390" role="img" aria-label="Four disaster recovery patterns ordered from lowest cost slowest recovery to highest cost fastest recovery"><path d="M100 315L820 75" stroke="#64748b" stroke-width="3"/><text class="s" x="130" y="350">lower steady cost / slower recovery</text><text class="s" x="650" y="55">higher steady cost / faster recovery</text><g><rect class="n" x="70" y="245" width="180" height="72" rx="12"/><text class="t" x="160" y="276" text-anchor="middle">Backup & restore</text><text class="s" x="160" y="298" text-anchor="middle">rebuild during recovery</text></g><g><rect class="n" x="265" y="190" width="180" height="72" rx="12"/><text class="t" x="355" y="221" text-anchor="middle">Pilot light</text><text class="s" x="355" y="243" text-anchor="middle">core stays ready</text></g><g><rect class="n" x="460" y="135" width="180" height="72" rx="12"/><text class="t" x="550" y="166" text-anchor="middle">Warm standby</text><text class="s" x="550" y="188" text-anchor="middle">reduced capacity live</text></g><g><rect class="n" x="655" y="80" width="180" height="72" rx="12"/><text class="t" x="745" y="111" text-anchor="middle">Active / active</text><text class="s" x="745" y="133" text-anchor="middle">multiple active sites</text></g></svg><figcaption>Choose the least-expensive DR pattern that still meets RTO and RPO. RTO/RPO depend on measured recovery, data replication and workload dependencies; a pattern name does not guarantee recovery times.</figcaption></figure></section></main><script type="application/json" id="visual-facts">{"facts": [{"claim": "Backup and restore generally has lower steady cost and longer recovery time than continuously running DR environments.", "objectives": ["saa-c03 2.2", "saa-c03 4.2"], "sources": ["notes aws-saa-resilient-architectures: Backup and disaster recovery", "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"]}, {"claim": "Pilot light keeps core services ready while other capacity is started during recovery.", "objectives": ["saa-c03 2.2"], "sources": ["notes aws-saa-resilient-architectures: Backup and disaster recovery", "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"]}, {"claim": "Warm standby keeps a reduced-capacity functional environment running.", "objectives": ["saa-c03 2.2"], "sources": ["notes aws-saa-resilient-architectures: Backup and disaster recovery", "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"]}, {"claim": "Active/active generally provides faster failover at higher steady cost and complexity.", "objectives": ["saa-c03 2.2", "saa-c03 4.2"], "sources": ["notes aws-saa-resilient-architectures: Backup and disaster recovery", "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"]}], "simplifications": ["Exact RTO/RPO and cost depend on the workload; the ladder shows relative design tradeoffs.", "RTO/RPO depend on measured recovery, data replication and workload dependencies; a pattern name does not guarantee recovery times."]}</script></body></html>
