<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESD and service safety</title><style>
:root{--bg:#eef3fa;--surface:#fff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;color-scheme:light}@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;color-scheme:dark}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui;padding:0 16px}.wrap{max-width:900px;margin:auto;padding:24px 0 40px}h1{font-size:26px;margin:0 0 6px}.lede,figcaption{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.diagram{overflow-x:auto}svg{width:100%;height:auto;min-width:640px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{font:inherit;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:8px 13px}button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.out{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);min-height:48px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><h1>ESD and service safety</h1><p class="lede">Use the safest sequence before touching or storing internal components.</p><section class="card"><figure><div class="diagram" tabindex="0" role="region" aria-label="ESD and service safety diagram"><svg viewBox="0 0 760 300" role="img" aria-label="Safe component handling path from power removal to ESD controls to antistatic storage">
<rect x="35" y="105" width="160" height="82" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="115" y="138" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">1. Power off</text><text x="115" y="164" text-anchor="middle" fill="var(--muted)" font-size="13">Disconnect power</text>
<path d="M195 146H285" stroke="var(--line)" stroke-width="4"/>
<rect x="285" y="90" width="190" height="112" rx="12" fill="var(--surface)" stroke="var(--good)" stroke-width="2"/><text x="380" y="126" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">2. Control ESD</text><text x="380" y="151" text-anchor="middle" fill="var(--muted)" font-size="13">Wrist strap / mat</text><text x="380" y="174" text-anchor="middle" fill="var(--muted)" font-size="13">Handle by edges</text>
<path d="M475 146H565" stroke="var(--line)" stroke-width="4"/>
<rect x="565" y="105" width="160" height="82" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="645" y="138" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">3. Store safely</text><text x="645" y="164" text-anchor="middle" fill="var(--muted)" font-size="13">Antistatic bag</text>
</svg></div><figcaption>Power removal, ESD controls, and antistatic storage form a safe handling sequence.</figcaption></figure><div class="controls"><button data-k="ram">Removed RAM module</button><button data-k="trip">Cable across walkway</button><button data-k="power">Opening a PC</button></div><div class="out" id="out" aria-live="polite">Choose an option to check your understanding.</div></section></main><script type="application/json" id="visual-facts">{
  "facts": [
    {
      "claim": "Use ESD controls such as an antistatic wrist strap and mat when handling sensitive components.",
      "objectives": [
        "220-1202 4.4"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: ESD protection and component handling"
      ]
    },
    {
      "claim": "Store removed components in antistatic bags.",
      "objectives": [
        "220-1202 4.4"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: ESD protection and component handling"
      ]
    },
    {
      "claim": "Disconnect power before servicing internal PC components.",
      "objectives": [
        "220-1202 4.4"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Electrical and personal safety"
      ]
    }
  ],
  "simplifications": [
    "The drawings are schematic learning diagrams."
  ]
}</script><script>document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-k]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const m={ram:'Use ESD controls and place the module in an antistatic bag.',trip:'Secure or reroute the cable so the walkway is clear.',power:'Disconnect power before internal service and follow the device procedure.'};document.getElementById('out').textContent=m[b.dataset.k];});</script></body></html>
