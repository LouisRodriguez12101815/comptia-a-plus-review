<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Core 2 Chapter 1 map: operating system basics</title>
<style>
:root{--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;--warm:#7a5418;--warm-soft:#f5ead8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
.wrap{max-width:920px;margin:0 auto;padding-block:24px 40px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.lab{margin:12px 0 6px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.lab:first-child{margin-top:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
button,select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
select{border-radius:8px;padding:4px 8px;font-weight:500}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;min-height:48px}
.out strong{color:var(--ink)}
.grid{display:grid;gap:10px}
.cell{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);min-width:0;font-size:14px}
.cell.good{border-color:var(--good);background:var(--good-soft)}
.cell.bad{border-color:var(--bad);background:var(--bad-soft)}
.cell.src{border-color:var(--accent);background:var(--accent-soft)}
.cell .t{font-weight:600}
.cell .s{color:var(--muted);font-size:13px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.answer{margin-top:14px;font-size:14px;color:var(--muted);max-width:72ch}
.answer strong{color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border-radius:10px;padding:10px 12px;font-weight:500}
.tile .n{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .tt{font-weight:600;font-size:14px;line-height:1.3}
.tile[aria-pressed="true"] .n{color:inherit;opacity:.85}
.detail h2{font:600 20px/1.25 Georgia,serif;margin:0 0 8px}
.detail ul{margin:0 0 10px;padding-left:20px}
.detail li{margin:3px 0}
.trap{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--warm-soft);color:var(--ink);font-size:14px}
.trap b{color:var(--warm)}
.seevis{margin-top:10px;font-size:13px;color:var(--muted)}
.seevis b{color:var(--accent)}
.navrow{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Core 2 Chapter 1 map: operating system basics</h1><p class="lede">Five topics from the notes. Pick one to see its key facts and the exam trap, then use Next to walk the chapter.</p><div class="card"><div class="lab">Pick a topic from the notes</div><div class="tiles" id="tiles"></div><div class="out detail" id="detail" aria-live="polite"></div><div class="navrow"><button id="prev">&larr; Previous topic</button><button id="next">Next topic &rarr;</button></div></div>
</div>
<script>
const ITEMS=[{"name": "Windows 11 system requirements", "tag": "1 \u00b7 Requirements", "facts": ["Processor: 1.0 GHz or faster, 2 cores minimum.", "RAM: 4 GB minimum (8 GB recommended).", "Storage: 64 GB minimum (CompTIA spec).", "Display 720p, 9 inch minimum. Firmware: UEFI with Secure Boot capable."], "trap": "TPM 2.0 is mandatory and is often the real upgrade blocker, not RAM or disk size.", "visual": "Windows 11 upgrade checker"}, {"name": "Editions and upgrade paths", "tag": "2 \u00b7 Editions", "facts": ["Home: local accounts only, no domain join, no BitLocker, no Remote Desktop host.", "Pro: domain join, BitLocker, Remote Desktop, Group Policy.", "Enterprise: domain-oriented, full feature set. Windows 11 is 64-bit.", "Same OS family and bitness can upgrade. Win10 Home to Win11 Pro can be in-family when licensing allows."], "trap": "32-bit to 64-bit requires a clean install. There is no in-place path and no stepping stone.", "visual": "Edition picker and upgrade path checker"}, {"name": "Boot process (in order)", "tag": "3 \u00b7 Boot", "facts": ["1 POST: BIOS/UEFI checks hardware.", "2 Boot loader locates the OS files.", "3 Kernel load, then 4 Logon (user authentication), then 5 Shell/desktop (GUI).", "Won't start at all: POST/hardware. BSOD during boot: driver/kernel. Stuck at logon: network/auth. Black screen: often display driver."], "trap": "Match the symptom to the stage that failed, not to the last thing you saw.", "visual": "Boot process stepper with fault injection"}, {"name": "File systems", "tag": "4 \u00b7 File systems", "facts": ["FAT32: 4 GB max file size, no permissions, no encryption, legacy.", "NTFS: huge files, permissions, BitLocker, journaling. Best for internal Windows drives.", "exFAT: huge files, no permissions, limited journaling. Best for USB and cross-platform.", "Internal C: = NTFS. External USB for Mac + Windows = exFAT."], "trap": "A 5 GB file will not fit on FAT32.", "visual": "File system chooser"}, {"name": "Registry and user accounts", "tag": "5 \u00b7 Registry, accounts", "facts": ["The registry is a hierarchical configuration database. Bad edits can prevent boot.", "HKLM = hardware, system, services. HKCU = current user settings. System Restore backs up the registry.", "Administrator = full access. Standard = apps, limited system changes. Guest = very restricted. Service accounts run background services, no interactive logon.", "Group Policy can lock settings company-wide. Use least privilege."], "trap": "Explicit Deny beats Allow.", "visual": "No separate visual. Covered by this map."}];
const tiles=document.getElementById('tiles'),detail=document.getElementById('detail');
let cur=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';
 b.innerHTML='<span class="n">'+esc(it.tag||('Topic '+(i+1)))+'</span><span class="tt">'+esc(it.name)+'</span>';
 b.onclick=()=>show(i);tiles.appendChild(b)});
function show(i){cur=i;const it=ITEMS[i];
 [...tiles.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'));
 let h='<h2>'+esc(it.name)+'</h2><ul>'+it.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>';
 if(it.trap)h+='<div class="trap"><b>Exam trap:</b> '+esc(it.trap)+'</div>';
 if(it.visual)h+='<div class="seevis">Interactive visual for this topic: <b>'+esc(it.visual)+'</b></div>';
 detail.innerHTML=h;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===ITEMS.length-1}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
show(0);

</script>
</body>
</html>
