<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find the failing part: power and boot symptoms</title>
<style>
:root{--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
.wrap{max-width:860px;margin:0 auto;padding-block:24px 40px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:row}
li{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;gap:8px;min-width:0;counter-increment:row}
li.good{border-color:var(--good);background:var(--good-soft)}
li.bad{border-color:var(--bad);background:var(--bad-soft)}
.sym{font-weight:600}
.sym::before{content:counter(row) ". ";color:var(--muted)}
.sym{overflow-wrap:anywhere}
.type{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;width:100%;max-width:100%}
.why{font-size:14px;margin:0}
.why[hidden]{display:none}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;min-height:48px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="wrap">
<h1>Find the failing part: power and boot symptoms</h1>
<p class="lede">A performance-based drill for 220-1201 objective 5.1. Pick the most likely cause for each symptom. A cause can be used more than once.</p>
<section class="card" aria-labelledby="h-drill">
<h2 id="h-drill" class="sr">Exercise</h2>
<ol id="rows"></ol>
<div class="ctrls">
<button type="button" class="primary" id="check">Check answers</button>
<button type="button" id="retry">Try again</button>
<button type="button" id="show">Show answers</button>
</div>
<p class="out" id="out" role="status" aria-live="polite">Choose a likely cause for each symptom.</p>
</section>
</main>
<script type="application/json" id="visual-facts">
{
  "kind": "exercise",
  "facts": [
    {
      "claim": "Fans spinning with no POST can still mean a bad power supply; test each output with a multimeter.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    },
    {
      "claim": "A clock that resets at every startup means a dead CMOS battery.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    },
    {
      "claim": "Random shutdowns with no message after running a while usually mean overheating.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    },
    {
      "claim": "Bulging capacitors mean a failing motherboard that must be replaced.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    },
    {
      "claim": "POST beep codes point to a failed core part such as RAM or video.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    },
    {
      "claim": "A black screen only after Windows loads points to the video driver.",
      "objectives": [
        "220-1201 5.1"
      ],
      "sources": [
        "notes core1-ch1-motherboards: Troubleshooting motherboards, RAM, CPUs and power (objective 5.1)"
      ]
    }
  ]
}
</script>
<script>
(function(){
  var MODELS = ["Power supply", "CMOS battery", "Overheating", "Failed motherboard", "RAM or video card", "Boot order", "Video driver"];
  var WHY = {
    "Power supply": "The power supply converts AC to DC; a bad one gives no power or wrong voltages even while fans spin.",
    "CMOS battery": "The CMOS battery only keeps the clock and firmware settings while the PC is off.",
    "Overheating": "Heat makes the system protect itself by shutting down, usually after running a while.",
    "Failed motherboard": "Physical damage on the board, such as bulging capacitors, means replacing the board.",
    "RAM or video card": "Beep codes and no display at POST point to a core part such as memory or video.",
    "Boot order": "Boot order only decides which device the firmware tries to start first.",
    "Video driver": "A driver loads with Windows, so it only matters after the OS starts."
};
  var ITEMS = [
    {
        "s": "Fans spin when the power button is pressed, but there is no POST and no display. The outlet and cord test fine.",
        "a": "Power supply",
        "w": "Spinning fans do not prove good voltages. Test each PSU output with a multimeter."
    },
    {
        "s": "Nothing happens at all: no fans and no lights, even on a known-good outlet and cord.",
        "a": "Power supply",
        "w": "With the outlet and cord ruled out, the power supply is next."
    },
    {
        "s": "The date resets to January 1 every morning.",
        "a": "CMOS battery",
        "w": "A clock that resets while the PC is off is the dead CMOS coin cell."
    },
    {
        "s": "The PC shuts down with no message after an hour; the heatsink is packed with dust.",
        "a": "Overheating",
        "w": "Dust blocks airflow, and the system shuts itself down to avoid heat damage."
    },
    {
        "s": "Several capacitors near the CPU socket have bulging tops.",
        "a": "Failed motherboard",
        "w": "Bulging capacitors are physical damage; reseating or settings will not fix them."
    },
    {
        "s": "Three beeps at power-on and nothing on the screen.",
        "a": "RAM or video card",
        "w": "Beep codes report a failed core part; look up the pattern for that board maker."
    },
    {
        "s": "The PC keeps starting a USB installer instead of Windows.",
        "a": "Boot order",
        "w": "USB is ahead of the internal drive in the boot order."
    },
    {
        "s": "The Windows logo appears, then the screen goes black.",
        "a": "Video driver",
        "w": "The display works until Windows loads its video driver. Start in Safe Mode and fix the driver."
    }
];
  var rows = document.getElementById("rows"), out = document.getElementById("out");
  function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function build(){
    var opts = shuffle(MODELS);
    rows.innerHTML = "";
    ITEMS.forEach(function(it, n){
      var li = document.createElement("li"), id = "pick-" + n;
      li.innerHTML = '<label class="sym" for="' + id + '"></label><select id="' + id + '"><option value="">Choose the likely cause</option></select><p class="why" hidden></p>';
      li.querySelector("label").textContent = it.s;
      var sel = li.querySelector("select");
      opts.forEach(function(o){ var op = document.createElement("option"); op.value = o; op.textContent = o; sel.appendChild(op); });
      rows.appendChild(li);
    });
  }
  function mark(showAll){
    var right = 0, blank = 0;
    ITEMS.forEach(function(it, n){
      var li = rows.children[n], sel = li.querySelector("select"), why = li.querySelector(".why");
      if (showAll) sel.value = it.a;
      if (!sel.value){ blank++; li.className = ""; why.hidden = true; return; }
      var ok = sel.value === it.a; if (ok) right++;
      li.className = ok ? "good" : "bad";
      why.hidden = false;
      why.textContent = ok ? "Correct. " + it.w : "Not this one. " + WHY[sel.value] + " The answer is " + it.a + ". " + it.w;
    });
    out.textContent = showAll ? "All answers shown. Use Try again to practise without them." :
      right + " of " + ITEMS.length + " correct" + (blank ? ", " + blank + " left blank." : ".") + (right === ITEMS.length ? " Well done." : " Use Try again to clear only the wrong rows.");
  }
  document.getElementById("check").addEventListener("click", function(){ mark(false); });
  document.getElementById("show").addEventListener("click", function(){ mark(true); });
  document.getElementById("retry").addEventListener("click", function(){
    var keep = ITEMS.map(function(it, n){ var v = rows.children[n].querySelector("select").value; return v === it.a ? v : ""; });
    build();
    keep.forEach(function(v, n){ rows.children[n].querySelector("select").value = v; if (v) rows.children[n].className = "good"; });
    out.textContent = "Wrong rows cleared and options shuffled. Correct rows are kept.";
  });
  build();
})();
</script>
</body>
</html>
