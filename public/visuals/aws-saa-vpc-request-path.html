<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VPC request path</title><style>body{margin:0;background:#0b1220;color:#f1f5f9;font:15px/1.5 system-ui;padding:20px}.wrap{max-width:920px;margin:auto}.card{border:1px solid #334155;border-radius:16px;background:#111c30;padding:18px}svg{width:100%;height:auto}figcaption{color:#b8c5d6}.node{fill:#16263f;stroke:#60a5fa;stroke-width:2}.pub{fill:#173147;stroke:#38bdf8}.priv{fill:#182b25;stroke:#34d399}.t{fill:#f1f5f9;font-size:15px;font-weight:700}.s{fill:#b8c5d6;font-size:12px}</style></head><body><main class="wrap"><h1>VPC request path</h1><p>Follow inbound public traffic and outbound traffic from a private subnet.</p><section class="card"><figure><svg viewBox="0 0 900 420" role="img" aria-label="VPC diagram with internet gateway public load balancer private application instances NAT gateway and route tables"><rect x="70" y="90" width="760" height="280" rx="24" fill="none" stroke="#475569" stroke-width="2"/><text class="t" x="90" y="120">VPC 10.0.0.0/16</text><rect class="node" x="350" y="20" width="200" height="56" rx="12"/><text class="t" x="450" y="53" text-anchor="middle">Internet</text><rect class="node" x="350" y="100" width="200" height="56" rx="12"/><text class="t" x="450" y="133" text-anchor="middle">Internet Gateway</text><rect class="pub" x="130" y="190" width="260" height="130" rx="18"/><text class="t" x="260" y="220" text-anchor="middle">Public subnet</text><text class="s" x="260" y="245" text-anchor="middle">ALB + NAT gateway</text><text class="s" x="260" y="267" text-anchor="middle">route 0.0.0.0/0 → IGW</text><rect class="priv" x="510" y="190" width="260" height="130" rx="18"/><text class="t" x="640" y="220" text-anchor="middle">Private subnet</text><text class="s" x="640" y="245" text-anchor="middle">application instances</text><text class="s" x="640" y="267" text-anchor="middle">route 0.0.0.0/0 → NAT</text><path d="M450 76V100M350 128H260V190" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#a)"/><path d="M390 255H510" stroke="#f1f5f9" stroke-width="3" marker-end="url(#a)"/><path d="M640 320V350H260V320" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs><text class="s" x="245" y="165" text-anchor="middle">public inbound path</text><text class="s" x="450" y="344" text-anchor="middle">private outbound path uses NAT</text></svg><figcaption>Internet-facing resources use the internet gateway path; private IPv4 workloads commonly use a NAT gateway for outbound internet access. This is one IPv4 path, not a complete HA design. A standard ALB needs subnets in at least two AZs. For zonal NAT use independent per-AZ paths; compare regional NAT. Native IPv6 outbound-only traffic uses an egress-only IGW with suitable controls.</figcaption></figure></section></main><script type="application/json" id="visual-facts">{"facts": [{"claim": "A public subnet has a route to an internet gateway for internet-bound traffic.", "objectives": ["saa-c03 3.4"], "sources": ["notes aws-saa-networking: VPC routing and public/private subnets", "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html?trk=article-ssr-frontend-pulse_little-text-block", "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html", "https://docs.aws.amazon.com/vpc/latest/userguide/ipv4-ipv6-comparison.html", "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-subnets.html"]}, {"claim": "A NAT gateway commonly provides outbound IPv4 internet access for resources in private subnets.", "objectives": ["saa-c03 3.4", "saa-c03 4.4"], "sources": ["notes aws-saa-networking: VPC routing and public/private subnets", "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html?trk=article-ssr-frontend-pulse_little-text-block", "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html", "https://docs.aws.amazon.com/vpc/latest/userguide/ipv4-ipv6-comparison.html", "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-subnets.html"]}, {"claim": "Security groups and network ACLs are separate traffic-control layers.", "objectives": ["saa-c03 1.2"], "sources": ["notes aws-saa-networking: Security groups and NACLs", "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html?trk=article-ssr-frontend-pulse_little-text-block", "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html", "https://docs.aws.amazon.com/vpc/latest/userguide/ipv4-ipv6-comparison.html", "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-subnets.html"]}], "simplifications": ["The diagram omits multiple AZs, detailed route tables, addresses, and security-rule evaluation.", "This is one IPv4 path, not a complete HA design. A standard ALB needs subnets in at least two AZs. For zonal NAT use independent per-AZ paths; compare regional NAT. Native IPv6 outbound-only traffic uses an egress-only IGW with suitable controls."]}</script></body></html>
