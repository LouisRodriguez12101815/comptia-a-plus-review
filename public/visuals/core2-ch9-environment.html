<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Environmental control picker</title><style>
:root{--bg:#eef3fa;--surface:#fff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;color-scheme:light}@media(prefers-color-scheme:dark){:root{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;color-scheme:dark}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui;padding:0 16px}.wrap{max-width:900px;margin:auto;padding:24px 0 40px}h1{font-size:26px;margin:0 0 6px}.lede,figcaption{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.diagram{overflow-x:auto}svg{width:100%;height:auto;min-width:640px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{font:inherit;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);padding:8px 13px}button[aria-pressed=true]{background:var(--accent);color:var(--bg);border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.out{margin-top:14px;padding:12px;border-radius:10px;background:var(--accent-soft);min-height:48px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="wrap"><h1>Environmental control picker</h1><p class="lede">Match the environmental problem to the control that addresses it.</p><section class="card"><figure><div class="diagram" tabindex="0" role="region" aria-label="Environmental control picker diagram"><svg viewBox="0 0 760 310" role="img" aria-label="Environmental controls comparing outage protection, surge protection, and disposal paths">
<rect x="40" y="45" width="200" height="90" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="140" y="80" text-anchor="middle" fill="var(--ink)" font-size="18" font-weight="700">Power outage</text><text x="140" y="106" text-anchor="middle" fill="var(--muted)" font-size="14">UPS → temporary power</text>
<rect x="280" y="45" width="200" height="90" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="380" y="80" text-anchor="middle" fill="var(--ink)" font-size="18" font-weight="700">Voltage spike</text><text x="380" y="106" text-anchor="middle" fill="var(--muted)" font-size="14">Surge suppressor</text>
<rect x="520" y="45" width="200" height="90" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="620" y="80" text-anchor="middle" fill="var(--ink)" font-size="18" font-weight="700">Hazardous waste</text><text x="620" y="106" text-anchor="middle" fill="var(--muted)" font-size="14">Approved disposal</text>
<path d="M140 135V220" stroke="var(--line)" stroke-width="4"/><path d="M380 135V220" stroke="var(--line)" stroke-width="4"/><path d="M620 135V220" stroke="var(--line)" stroke-width="4"/>
<text x="140" y="250" text-anchor="middle" fill="var(--good)" font-size="14" font-weight="700">Keeps system running briefly</text><text x="380" y="250" text-anchor="middle" fill="var(--good)" font-size="14" font-weight="700">Clamps transient spikes</text><text x="620" y="250" text-anchor="middle" fill="var(--good)" font-size="14" font-weight="700">Recycle / approved process</text>
</svg></div><figcaption>Outages, voltage spikes, and hazardous waste require different controls.</figcaption></figure><div class="controls"><button data-k="blackout">Brief blackout</button><button data-k="spike">Power spike</button><button data-k="battery">Used battery</button></div><div class="out" id="out" aria-live="polite">Choose an option to check your understanding.</div></section></main><script type="application/json" id="visual-facts">{
  "facts": [
    {
      "claim": "A UPS can provide temporary power during an outage.",
      "objectives": [
        "220-1202 4.5"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Environmental controls and disposal"
      ]
    },
    {
      "claim": "A surge suppressor protects equipment from voltage spikes but does not provide backup power.",
      "objectives": [
        "220-1202 4.5"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Environmental controls and disposal"
      ]
    },
    {
      "claim": "Batteries and toner require approved recycling or disposal handling.",
      "objectives": [
        "220-1202 4.5"
      ],
      "sources": [
        "notes core2-ch9-safety-environment: Environmental controls and disposal"
      ]
    }
  ],
  "simplifications": [
    "The drawings are schematic learning diagrams."
  ]
}</script><script>document.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-k]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const m={blackout:'Use a UPS when the system needs temporary power during an outage.',spike:'Use surge protection for voltage spikes; it does not replace a UPS.',battery:'Follow the approved recycling or hazardous-material disposal process.'};document.getElementById('out').textContent=m[b.dataset.k];});</script></body></html>
