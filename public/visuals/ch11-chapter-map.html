<h1>Chapter 11 map: switching and VLANs</h1><p class="lede">Nine topics from the notes in the order you meet them. Pick one to see its key facts and the one exam trap, then use Next to walk the chapter.</p><div class="card"><div class="lab">Pick a topic from the notes</div><div class="tiles" id="tiles"></div><div class="out detail" id="detail" aria-live="polite"></div><div class="navrow"><button id="prev">&larr; Previous topic</button><button id="next">Next topic &rarr;</button></div></div>
</div>
<script>
const ITEMS=[{"name": "Switches, hubs, and bridges", "tag": "1 \u00b7 Devices", "facts": ["A switch has the lowest latency and highest bandwidth because ASICs forward frames in hardware.", "A hub is a multiport repeater: every signal goes to every port and the bandwidth is shared.", "A bridge is a software-based switch, so its latency is higher.", "A router adds latency because each packet is decapsulated, routed, and re-encapsulated."], "trap": "\"Lowest latency, highest bandwidth\" is the switch, not the router or the hub.", "visual": "Hubs, bridges, switches, and routers"}, {"name": "How a switch learns and forwards", "tag": "2 \u00b7 MAC table", "facts": ["It learns from the SOURCE MAC of each incoming frame and stores it in the MAC address table.", "It forwards by the DESTINATION MAC found in that table.", "Unknown destination: the frame is flooded to every port in the same VLAN.", "Broadcasts stay inside their VLAN because they cannot cross a router."], "trap": "Switches learn from the source address, never the destination.", "visual": "Switch learning and flooding"}, {"name": "VLANs and broadcast domains", "tag": "3 \u00b7 VLANs", "facts": ["Adding a VLAN adds broadcast domains (and collision domains).", "Every port starts in VLAN 1. VLANs 1 and 1002 to 1005 are protected and cannot be deleted.", "Static VLANs: the administrator sets each port by hand; the node does not know its VLAN.", "Dynamic VLANs: a VMPS assigns the port by MAC address. Deprecated; 802.1X replaces it."], "trap": "VLAN 1 cannot be deleted.", "visual": "VLANs and broadcast domains, Static vs dynamic VLANs, Broadcast and collision domains"}, {"name": "Access ports and trunk ports", "tag": "4 \u00b7 Ports", "facts": ["Access: one VLAN for an end device; the tag is removed before the frame leaves the port.", "Trunk: many VLANs between switches or routers; tags are carried end to end.", "Native VLAN: the untagged traffic on a trunk, often used for switch management.", "Set port security on an access port. A trunk carries too many MAC addresses."], "trap": "Tagged traffic is never placed on the native VLAN. Only untagged traffic is.", "visual": "Access ports, trunks, and the native VLAN"}, {"name": "802.1Q tagging", "tag": "5 \u00b7 Tagging", "facts": ["802.1Q is the open standard. ISL is Cisco-only, so it fails between different vendors.", "The 4-byte (32-bit) tag sits between the source MAC and the type field.", "Tag = 16-bit TPID (0x8100) + 3-bit CoS + 1-bit drop-eligible + 12-bit VLAN ID."], "trap": "Mixed-vendor trunk? Choose 802.1Q.", "visual": "802.1Q frame tag, Choosing a trunking protocol"}, {"name": "Spanning Tree Protocol", "tag": "6 \u00b7 STP", "facts": ["STP (802.1D) prevents switching loops. RSTP (802.1w) is the faster version.", "The root bridge has the lowest priority; at default priorities the lowest MAC wins.", "A port starts in blocking by default.", "STP takes 50 seconds to converge from blocking to forwarding."], "trap": "Lowest priority wins, and ties go to the lowest MAC address.", "visual": "STP root bridge election, STP port states"}, {"name": "Routed VLANs and segmentation", "tag": "7 \u00b7 Routing", "facts": ["To segment a workgroup (for example R&D): new VLAN, routed SVI, ACLs on the VLAN interface.", "ACLs belong on the layer 3 VLAN interface. Extended ACLs cannot go on layer 2 switch ports.", "Moving a server into the new VLAN, or trunking the file server to both VLANs, does not restrict access."], "trap": "The ACL goes on the SVI, not on a layer 2 port.", "visual": "Segmenting with an SVI and ACLs"}, {"name": "Port security", "tag": "8 \u00b7 Security", "facts": ["Limits a port to a set number of MAC addresses, configured in advance or learned dynamically.", "Configured on an access port in access mode.", "It is not jumbo frames and not 802.1X (those control frame size and user authentication)."], "trap": null, "visual": "Port security"}, {"name": "QoS, PoE, and VTP", "tag": "9 \u00b7 Extras", "facts": ["CoS is the layer 2 QoS method: a 3-bit field in the 802.1Q tag mapping to eight queues.", "ToS and DiffServ are layer 3 methods.", "802.3at delivers 25.5 watts of PoE.", "VTP copies the VLAN database from a server switch to client switches. It does not negotiate trunks."], "trap": "VTP propagates VLANs; it does not build trunks.", "visual": "QoS marking by layer, Power over Ethernet budget, VTP and protected VLANs"}];
const tiles=document.getElementById('tiles'),detail=document.getElementById('detail');
let cur=0;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
ITEMS.forEach((it,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';
 b.innerHTML='<span class="n">'+esc(it.tag||('Topic '+(i+1)))+'</span><span class="tt">'+esc(it.name)+'</span>';
 b.onclick=()=>show(i);tiles.appendChild(b)});
function show(i){cur=i;const it=ITEMS[i];
 [...tiles.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false'));
 let h='<h2>'+esc(it.name)+'</h2><ul>'+it.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>';
 if(it.trap)h+='<div class="trap"><b>Exam trap:</b> '+esc(it.trap)+'</div>';
 if(it.visual)h+='<div class="seevis">Interactive visual for this topic: <b>'+esc(it.visual)+'</b></div>';
 detail.innerHTML=h;
 document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===ITEMS.length-1}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
show(0);

</script>
