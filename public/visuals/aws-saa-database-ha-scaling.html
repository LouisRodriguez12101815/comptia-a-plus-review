<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDS availability vs read scaling</title><style>body{margin:0;background:#0b1220;color:#f1f5f9;font:15px/1.5 system-ui;padding:20px}.wrap{max-width:920px;margin:auto}.card{border:1px solid #334155;border-radius:16px;background:#111c30;padding:18px}svg{width:100%;height:auto}figcaption{color:#b8c5d6}.n{fill:#16263f;stroke:#60a5fa;stroke-width:2}.ha{stroke:#34d399}.read{stroke:#f59e0b}.t{fill:#f1f5f9;font-size:16px;font-weight:700}.s{fill:#b8c5d6;font-size:12px}</style></head><body><main class="wrap"><h1>RDS: availability vs read scaling</h1><p>Two features can involve another database instance, but their primary goals differ.</p><section class="card"><figure><svg viewBox="0 0 900 380" role="img" aria-label="RDS primary with Multi-AZ standby for availability and read replicas for read scaling"><rect class="n" x="350" y="35" width="200" height="70" rx="14"/><text class="t" x="450" y="65" text-anchor="middle">RDS writer</text><text class="s" x="450" y="87" text-anchor="middle">application writes</text><rect class="n" x="90" y="215" width="220" height="80" rx="14"/><text class="t" x="200" y="248" text-anchor="middle">Multi-AZ standby</text><text class="s" x="200" y="272" text-anchor="middle">availability / failover</text><rect class="n" x="590" y="190" width="220" height="80" rx="14"/><text class="t" x="700" y="223" text-anchor="middle">Read replica</text><text class="s" x="700" y="247" text-anchor="middle">serve read traffic</text><path d="M390 105L230 215" class="ha" stroke-width="4"/><path d="M510 105L670 190" class="read" stroke-width="4"/><text x="275" y="162" class="s" fill="#34d399">synchronous/managed HA path</text><text x="620" y="150" class="s" fill="#f59e0b">read-scaling path</text><rect x="300" y="320" width="300" height="42" rx="10" fill="#1f2937"/><text class="s" x="450" y="345" text-anchor="middle">Exam cue: availability ≠ read throughput</text></svg><figcaption>Multi-AZ is primarily an availability feature; read replicas primarily add read capacity. Single-standby RDS Multi-AZ DB instances have a non-readable standby; Multi-AZ DB clusters have readable standbys. Read replicas are asynchronous and can lag.</figcaption></figure></section></main><script type="application/json" id="visual-facts">{"facts": [{"claim": "RDS Multi-AZ is primarily used for high availability and failover.", "objectives": ["saa-c03 2.2", "saa-c03 3.3"], "sources": ["notes aws-saa-databases: Relational database choices", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html", "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html"]}, {"claim": "RDS read replicas are primarily used to scale read traffic.", "objectives": ["saa-c03 3.3"], "sources": ["notes aws-saa-databases: Relational database choices", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html", "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html"]}, {"claim": "RDS Proxy can help manage database connection pressure for supported engines.", "objectives": ["saa-c03 3.3"], "sources": ["notes aws-saa-databases: Relational database choices", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html", "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html", "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html"]}], "simplifications": ["Replication details vary by database engine and service configuration; the diagram emphasizes the exam-level primary purpose.", "Single-standby RDS Multi-AZ DB instances have a non-readable standby; Multi-AZ DB clusters have readable standbys. Read replicas are asynchronous and can lag."]}</script></body
