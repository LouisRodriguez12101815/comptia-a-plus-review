xt><text class="sub" x="565" y="226" text-anchor="middle">shared file access</text></g><g><rect class="box" x="685" y="145" width="190" height="110" rx="12"/><text class="label" x="780" y="178" text-anchor="middle">Instance store</text><text class="sub" x="780" y="203" text-anchor="middle">ephemeral block</text><text class="sub" x="780" y="226" text-anchor="middle">fast disposable scratch</text></g><text class="sub" x="450" y="315" text-anchor="middle">Exam move: identify the access model, persistence need, sharing need, and retrieval/access pattern.</text></svg><figcaption>Storage service choice starts with the storage model and workload constraints, not with memorizing service names. Check service variants, AZ scope, consistency, throughput and cost; this storage-family map is only the first selection step.</figcaption></figure></section></main><script type="application/json" id="visual-facts">{"facts": [{"claim": "Amazon S3 is object storage.", "objectives": ["saa-c03 3.1", "saa-c03 4.1"], "sources": ["notes aws-saa-storage: S3 architecture", "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html", "https://docs.aws.amazon.com/ebs/latest/userguide/EBSFeatures.html", "https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html", "https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html", "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html"]}, {"claim": "Amazon EBS provides persistent block storage used by EC2 workloads.", "objectives": ["saa-c03 3.1", "saa-c03 4.1"], "sources": ["notes aws-saa-storage: Block and file storage", "https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html", "https://docs.aws.amazon.com/ebs/latest/userguide/EBSFeatures.html", "https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html", "https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html", "https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html"]}, {"claim": "Amazon EFS and Amazon FSx provide
