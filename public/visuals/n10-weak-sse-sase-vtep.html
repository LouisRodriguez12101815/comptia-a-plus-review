<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSE, SASE and the VTEP</title>
<style>
:root{--bg:#eef3fa;--surface:#ffffff;--ink:#0f1d33;--muted:#44546e;--line:#c5d2e3;--accent:#1d4f91;--accent-soft:#dde8f7;--good:#1f6a4a;--good-soft:#d9efe3;--bad:#a13a2c;--bad-soft:#f8dedb;--warm:#7a5418;--warm-soft:#f5ead8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1424;--surface:#13223a;--ink:#e7eef9;--muted:#a9b8cf;--line:#2a3d5c;--accent:#7cc4ff;--accent-soft:#1a3354;--good:#8fe0b4;--good-soft:#173a2d;--bad:#ffab9c;--bad-soft:#3e1f1d;--warm:#f2c57f;--warm-soft:#3a2d18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px}
.wrap{max-width:920px;margin:0 auto;padding-block:24px 40px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 6px;text-wrap:balance}
.lede{margin:0 0 16px;color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{font-size:13px;font-weight:600}
input[type=range]{width:min(360px,100%);accent-color:var(--accent)}
figure{margin:8px 0 0}
svg{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px}
figcaption{margin-top:8px;font-size:13px;color:var(--muted)}
.out{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14px;min-height:48px}
.out strong{color:var(--ink)}
code,.cmd{font-family:ui-monospace,Menlo,Consolas,monospace}
.answer{margin-top:14px;font-size:14px;color:var(--muted);max-width:72ch}
.answer strong{color:var(--ink)}
svg text{fill:var(--ink);font:13px system-ui,sans-serif}
svg .m{fill:var(--muted)}
svg .b{stroke:var(--accent);fill:var(--accent-soft)}
svg .g{stroke:var(--good);fill:var(--good-soft)}
svg .w{stroke:var(--warm);fill:var(--warm-soft)}
svg .r{stroke:var(--bad);fill:var(--bad-soft)}
svg .n{stroke:var(--line);fill:var(--surface)}
svg rect,svg line,svg path{stroke-width:2}
svg .ln-b{stroke:var(--accent);fill:none}
svg .ln-g{stroke:var(--good);fill:none}
svg .ln-r{stroke:var(--bad);fill:none}
svg .ln-m{stroke:var(--muted);fill:none}
svg .dash{stroke-dasharray:6 5}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>SSE, SASE and the VTEP</h1>
<p class="lede">Three 1.8 terms that look alike. Pick one to see what it is made of.</p>
<div class="card">
  <div class="ctrls" id="modes" role="group" aria-label="Term"><button type="button" data-k="sse" aria-pressed="true">SSE</button><button type="button" data-k="sase" aria-pressed="false">SASE</button><button type="button" data-k="casb" aria-pressed="false">CASB</button><button type="button" data-k="vtep" aria-pressed="false">VTEP</button></div>
  <figure>
    <svg id="svg" viewBox="0 0 760 300" role="img" aria-label="Diagram"></svg>
    <figcaption id="cap"></figcaption>
  </figure>
  <div class="out" id="out" aria-live="polite"></div>
  <p class="answer"><strong>Rules to keep.</strong> SSE is SWG plus CASB plus ZTNA plus FWaaS. SASE is SSE plus SD-WAN. CASB controls SaaS use and finds shadow IT. A VTEP adds and removes VXLAN encapsulation.</p>
</div>
</div>
<script type="application/json" id="visual-facts">{"kind": "revised", "facts": [{"claim": "Security service edge (SSE) bundles cloud-delivered security services: secure web gateway (SWG), cloud access security broker (CASB), zero trust network access (ZTNA) and firewall as a service (FWaaS); secure access service edge (SASE) adds SD-WAN to SSE.", "objectives": ["n10-009 1.8"], "sources": ["https://en.wikipedia.org/wiki/Secure_access_service_edge"]}, {"claim": "A cloud access security broker (CASB) sits between users and cloud services to control SaaS use and discover shadow IT.", "objectives": ["n10-009 1.8"], "sources": ["https://en.wikipedia.org/wiki/Cloud_access_security_broker"]}, {"claim": "A VXLAN tunnel endpoint (VTEP) encapsulates frames into VXLAN when they enter the tunnel and decapsulates them when they leave it.", "objectives": ["n10-009 1.8"], "sources": ["https://www.rfc-editor.org/rfc/rfc7348"]}], "simplifications": ["The bundle membership follows the exam's definition; vendors package SSE and SASE differently.", "The VTEP view shows one direction of one tunnel."]}</script>
<script>

const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const R=(x,y,w,h,c,rx)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx??8}" class="${c}"/>`;
const T=(x,y,s,o)=>`<text x="${x}" y="${y}" text-anchor="${(o&&o.a)||'middle'}"${o&&o.c?` class="${o.c}"`:''}${o&&o.b?' font-weight="700"':''}>${esc(s)}</text>`;
const L=(x1,y1,x2,y2,c,arrow)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"${arrow?' marker-end="url(#ah)"':''}/>`;
const DEFS='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>';
function draw(svgId,labelId,inner,label){const s=document.getElementById(svgId);s.innerHTML=DEFS+inner;s.setAttribute('aria-label',label);document.getElementById(labelId).textContent=label;}
function pressed(groupId,key){document.querySelectorAll('#'+groupId+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===key)));}


function box(x,y,w,h,c,t,sub){return R(x,y,w,h,c)+T(x+w/2,y+h/2+(sub?-2:5),t,{b:1})+(sub?T(x+w/2,y+h/2+16,sub,{c:'m'}):'');}
const INFO={
 sse:['SSE is four cloud-delivered security services.','<strong>SSE</strong> = SWG + CASB + ZTNA + FWaaS. Security only, no networking piece.'],
 sase:['SASE is SSE plus SD-WAN.','<strong>SASE</strong> = SSE + SD-WAN. The extra word to remember is SD-WAN.'],
 casb:['A CASB controls SaaS use and finds shadow IT.','<strong>CASB</strong> sits between users and cloud apps. It controls SaaS use and discovers shadow IT. A secure web gateway filters web traffic; it is not the CASB.'],
 vtep:['A VTEP adds and removes VXLAN encapsulation.','<strong>VTEP</strong> = VXLAN tunnel endpoint. It wraps frames going in and unwraps them coming out. It is not a DHCP server, a backup tool or a web filter.']};
function show(k){
 let s='';
 if(k==='sse'||k==='sase'){
  ['SWG','CASB','ZTNA','FWaaS'].forEach((t,i)=>{s+=box(40+i*172,60,150,60,'g',t);});
  s+=T(380,40,'SSE (security)',{b:1});
  if(k==='sase'){s+=box(270,150,220,60,'w','SD-WAN','networking');s+=T(380,250,'SASE = SSE + SD-WAN',{b:1});}
  else s+=T(380,170,'SWG, CASB, ZTNA and FWaaS together',{c:'m'});
 }else if(k==='casb'){
  s+=box(40,100,150,70,'b','Users');s+=box(305,100,150,70,'g','CASB','controls SaaS use');s+=box(570,100,150,70,'n','SaaS apps');
  s+=L(190,135,305,135,'ln-b',1)+L(455,135,570,135,'ln-g',1)+T(380,230,'Also finds shadow IT: apps used without approval',{b:1});
 }else{
  s+=box(30,110,130,70,'g','VTEP A');s+=box(600,110,130,70,'g','VTEP B');
  s+=L(160,145,600,145,'ln-b',1)+T(380,128,'VXLAN tunnel (UDP 4789)',{b:1});
  s+=T(95,215,'adds the wrapper',{c:'m'})+T(665,215,'removes the wrapper',{c:'m'});
 }
 draw('svg','cap',s,INFO[k][0]);document.getElementById('out').innerHTML=INFO[k][1];pressed('modes',k);
}
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
show('sse');

</script>
</body>
</html>
