ographic-copy requirements.</figcaption></figure></section></main><script type="application/json" id="visual-facts">{"facts":[{"claim":"S3 lifecycle rules can transition objects between storage classes or expire objects according to policy.","objectives":["SAA-C03 4.1"],"sources":["notes aws-saa-storage: S3 architecture","notes aws-saa-cost-optimized: Cost-optimize storage"]},{"claim":"S3 versioning supports recovery from overwrite/deletion scenarios and participates in replication designs.","objectives":["SAA-C03 1.3","SAA-C03 2.2"],"sources":["notes aws-saa-storage: S3 architecture"]},{"claim":"Cross-Region replication creates copies in another Region when a geographic-copy requirement exists.","objectives":["SAA-C03 2.2"],"sources":["notes aws-saa-storage: Durability, availability, and replication"]},{"claim":"Replication and backup/lifecycle policies address different requirements.","objectives":["SAA-C03 2.2","SAA-C03 4.1"],"sources":["notes aws-saa-resilient-architectures: Backup and disaster recovery"]}],"simplifications":["Storage-class eligibility, minimum durations, retrieval charges, and replication prerequisites vary; consult current AWS documentation for implementation."]}</script></body></html>
